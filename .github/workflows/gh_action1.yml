# This is a basic workflow to help you get started with Actions

name: CI

# Controla cuándo se ejecutará el flujo de trabajo.
on:
  # Dispara el workflow en push / pull_request sobre las ramas listadas
  push:
    branches: [ "dev", "dev-test", "test", "main" ]
    paths: ["gh_action_example2/**"]
  pull_request:
    branches: [ "dev", "dev-test", "test", "main" ]
    paths: ["gh_action_example2/**"]

  # Permite ejecutar el workflow manualmente desde la pestaña Actions
  workflow_dispatch:

# Un workflow run se compone de uno o más jobs que pueden correr en paralelo o secuencia
jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Comandos echo básicos de demostración
  # ─────────────────────────────────────────────
  echos:
    runs-on: ubuntu-latest
    name: 1st job

    steps:
      # Checkout del repositorio (descomenta si el job necesita acceder al código)
      #- uses: actions/checkout@v4

      # Ejecuta un comando de una sola línea
      - name: Run a one-line script
        run: echo Hello, world!

      # Ejecuta un bloque de comandos multilínea
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

  # ─────────────────────────────────────────────
  # JOB 2 — Demostración de variables de entorno
  # ─────────────────────────────────────────────
  variables_entorno:
    name: 2nd job
    runs-on: ubuntu-latest
    steps:
      - name: Show the demo running
        env:
          VAR1: This is
          VAR2: A Demo of
          VAR3: GitHub Actions
          VAR4: Workflow jobs
          VAR5: by Ariel
        run: |
          echo $VAR1 $VAR2 $VAR3 $VAR4 $VAR5.

  # ─────────────────────────────────────────────
  # JOB 3 — Terraform: init → plan → apply
  # Selecciona el .tfvars según la rama que dispara el workflow:
  #   dev      → envs/dev.tfvars
  #   dev-test → envs/dev-test.tfvars
  #   test     → envs/test.tfvars
  #   main     → envs/prod.tfvars
  # ─────────────────────────────────────────────
  terraform-build:
    name: 3rd job - Terraform Build
    runs-on: ubuntu-latest

    # Directorio raíz de Terraform (donde vive main.tf)
    defaults:
      run:
        working-directory: gh_action_example2/terraform

    steps:
      # 1. Checkout del repositorio (necesario para acceder a los archivos .tf y .tfvars)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instala la CLI de Terraform en el runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # 3. Determina el archivo .tfvars según la rama activa y lo expone como variable de entorno
      - name: Set environment tfvars
        id: set_env
        run: |
          BRANCH="${{ github.ref_name }}"
          case "$BRANCH" in
            dev)      TFVARS="envs/dev.tfvars" ;;
            dev-test) TFVARS="envs/dev-test.tfvars" ;;
            test)     TFVARS="envs/test.tfvars" ;;
            main)     TFVARS="envs/prod.tfvars" ;;
            *)        TFVARS="envs/dev.tfvars" ;;  # fallback a dev para ramas de feature
          esac
          echo "TFVARS_FILE=$TFVARS" >> $GITHUB_ENV
          echo "Usando archivo de variables: $TFVARS"

      # 4. Terraform Init — inicializa el backend y descarga los providers
      - name: Terraform Init
        id: tf_init
        run: terraform init
        # Continúa aunque falle para poder capturar el error en el paso siguiente
        continue-on-error: true

      # 4b. Manejo de error en Init — imprime mensaje descriptivo y detiene el job
      - name: Handle Init failure
        if: steps.tf_init.outcome == 'failure'
        run: |
          echo "::error::❌ TERRAFORM INIT ha fallado. Revisá la configuración del backend o los providers."
          exit 1

      # 5. Terraform Plan — genera el plan de ejecución usando el .tfvars del entorno
      - name: Terraform Plan
        id: tf_plan
        run: terraform plan -var-file="${{ env.TFVARS_FILE }}" -out=tfplan
        continue-on-error: true

      # 5b. Manejo de error en Plan — imprime mensaje descriptivo y detiene el job
      - name: Handle Plan failure
        if: steps.tf_plan.outcome == 'failure'
        run: |
          echo "::error::❌ TERRAFORM PLAN ha fallado con el archivo ${{ env.TFVARS_FILE }}. Revisá las variables o los recursos definidos."
          exit 1

      # 6. Terraform Apply — aplica el plan generado (solo en push, no en pull_request)
      - name: Terraform Apply
        id: tf_apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve tfplan
        continue-on-error: true

      # 6b. Manejo de error en Apply — imprime mensaje descriptivo y detiene el job
      - name: Handle Apply failure
        if: steps.tf_apply.outcome == 'failure'
        run: |
          echo "::error::❌ TERRAFORM APPLY ha fallado. Revisá los permisos del provider o el estado del plan."
          exit 1

      # 7. Confirmación de éxito
      - name: Terraform apply success
        if: github.event_name == 'push'
        run: echo "✅ Terraform Apply completado exitosamente para el entorno ${{ env.TFVARS_FILE }}."
